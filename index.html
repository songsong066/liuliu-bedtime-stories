<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="六六睡前故事" />
    <title>六六睡前故事</title>
    <style>
      :root {
        --paper: #fbfaf7;
        --wash: #f4eff8;
        --line: rgba(255, 255, 255, 0.82);
        --text: #0f0f10;
        --muted: #737373;
        --soft: #f1f1f1;
        --accent: #9e8bbe;
        --accent-soft: rgba(158, 139, 190, 0.18);
        --shadow: 0 16px 36px rgba(64, 50, 38, 0.09);
        --card-shadow: 0 10px 24px rgba(158, 139, 190, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.75);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background: var(--paper);
        color: var(--text);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      button {
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      img {
        display: block;
        max-width: 100%;
      }

      .app-shell {
        min-height: 100dvh;
      }

      .phone {
        position: relative;
        min-height: 100dvh;
        overflow: visible;
        background: var(--paper);
      }

      .backdrop {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 16% 6%, rgba(158, 139, 190, 0.26), transparent 34%),
          linear-gradient(180deg, #f6f2fb 0%, #f8f3ee 48%, #fffaf4 100%);
      }

      .view {
        position: relative;
        min-height: 100dvh;
        padding: 26px 20px calc(28px + env(safe-area-inset-bottom));
      }

      .hidden {
        display: none !important;
      }

      .top-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .eyebrow {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.18em;
      }

      .home-title {
        margin: 8px 0 0;
        white-space: nowrap;
        font-size: 30px;
        line-height: 1.08;
        font-weight: 700;
        letter-spacing: 0;
      }

      .hint {
        margin: 12px 0 0;
        max-width: 305px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.75;
      }

      .icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        color: #454545;
      }

      .icon {
        width: 24px;
        height: 24px;
        stroke: currentColor;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .icon.fill {
        fill: currentColor;
      }

      .icon .fill {
        fill: currentColor;
        stroke: none;
      }

      .icon-button.is-favorite {
        color: var(--accent);
      }

      .icon-button.is-favorite .icon {
        fill: currentColor;
      }

      #playIcon .icon {
        width: 36px;
        height: 36px;
      }

      .section {
        margin-top: 22px;
      }

      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .section-title {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
        font-weight: 700;
      }

      .section-note {
        color: var(--muted);
        font-size: 13px;
      }

      .recorded-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .recorded-card,
      .category-card,
      .story-card,
      .story-panel,
      .audio-panel {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.66);
        box-shadow: var(--card-shadow);
        backdrop-filter: blur(8px);
      }

      .recorded-card {
        overflow: hidden;
        border-radius: 24px;
        padding: 8px;
        text-align: left;
        transition: transform 0.18s ease;
      }

      .recorded-card:active,
      .category-card:active,
      .story-card:active,
      .round-control:active,
      .play-control:active {
        transform: scale(0.97);
      }

      .recorded-card img {
        width: 100%;
        height: 92px;
        border-radius: 19px;
        object-fit: cover;
      }

      .recorded-card strong {
        display: block;
        min-height: 36px;
        margin-top: 9px;
        padding: 0 2px;
        font-size: 15px;
        line-height: 1.2;
        font-weight: 700;
      }

      .recorded-card .mini-play {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .recorded-card .mini-play .icon {
        flex: 0 0 auto;
        color: var(--accent);
      }

      .category-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .category-card {
        display: flex;
        height: 84px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        text-align: center;
      }

      .category-card.active {
        border-color: rgba(158, 139, 190, 0.45);
        background: var(--accent-soft);
      }

      .category-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.78);
        color: #656565;
      }

      .category-card.active .category-icon {
        background: var(--accent);
        color: white;
      }

      .category-label {
        margin-top: 7px;
        color: var(--text);
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
      }

      .story-list {
        display: grid;
        gap: 12px;
        padding-bottom: 16px;
      }

      .story-card {
        display: grid;
        grid-template-columns: 78px minmax(0, 1fr) 28px;
        align-items: center;
        gap: 14px;
        width: 100%;
        border-radius: 26px;
        padding: 12px;
        text-align: left;
      }

      .story-card img {
        width: 78px;
        height: 78px;
        border-radius: 20px;
        object-fit: cover;
      }

      .story-card small {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      .story-card strong {
        display: block;
        margin-top: 4px;
        font-size: 19px;
        line-height: 1.22;
        font-weight: 700;
      }

      .player-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .player-title-top {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.18em;
      }

      .story-panel {
        overflow: hidden;
        border-radius: 32px;
        padding: 12px;
      }

      .player-cover {
        width: 100%;
        height: 232px;
        border-radius: 26px;
        object-fit: cover;
      }

      .story-copy {
        padding: 20px 10px 10px;
      }

      .meta {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
      }

      .story-name {
        margin: 8px 0 0;
        font-size: 31px;
        line-height: 1.18;
        font-weight: 800;
        letter-spacing: 0;
      }

      .summary {
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.75;
      }

      .audio-panel {
        position: sticky;
        bottom: 0;
        z-index: 2;
        margin-top: 18px;
        border-radius: 32px 32px 0 0;
        padding: 18px 20px calc(20px + env(safe-area-inset-bottom));
        background: rgba(246, 242, 251, 0.94);
      }

      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 15px;
      }

      .status-label {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      .status-text {
        margin: 3px 0 0;
        color: var(--text);
        font-size: 18px;
        font-weight: 800;
      }

      .audio-badge {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: var(--accent-soft);
        color: #575757;
      }

      .time-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 7px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }

      .seek-wrap {
        position: relative;
        height: 34px;
        margin-bottom: 18px;
      }

      .seek-track {
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        height: 8px;
        transform: translateY(-50%);
        overflow: hidden;
        border-radius: 999px;
        background: #e4e4e4;
      }

      .seek-fill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
      }

      .seek {
        position: absolute;
        inset: 0 -2px;
        width: calc(100% + 4px);
        appearance: none;
        background: transparent;
      }

      .seek:disabled {
        opacity: 0.45;
      }

      .seek::-webkit-slider-runnable-track {
        height: 8px;
        background: transparent;
      }

      .seek::-webkit-slider-thumb {
        width: 24px;
        height: 24px;
        margin-top: -8px;
        appearance: none;
        border: 5px solid white;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 4px 14px rgba(158, 139, 190, 0.4);
      }

      .seek::-moz-range-track {
        height: 8px;
        background: transparent;
      }

      .seek::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border: 5px solid white;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 4px 14px rgba(158, 139, 190, 0.4);
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }

      .round-control,
      .play-control {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--accent);
        color: white;
        box-shadow: 0 12px 24px rgba(158, 139, 190, 0.24);
        transition: transform 0.18s ease;
      }

      .round-control {
        width: 50px;
        height: 50px;
      }

      .play-control {
        width: 76px;
        height: 76px;
      }

      .play-control:disabled,
      .round-control:disabled {
        background: #d5d5d5;
        box-shadow: none;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (min-width: 481px) {
        body {
          background: #ede8df;
        }

        .app-shell {
          display: grid;
          place-items: center;
          padding: 28px;
        }

        .phone {
          width: 375px;
          height: 812px;
          min-height: 812px;
          overflow: hidden;
          border: 1px solid #d6d6d6;
          border-radius: 34px;
          box-shadow: var(--shadow);
        }

        .backdrop {
          position: absolute;
        }

        .view {
          height: 100%;
          min-height: 0;
          overflow-y: auto;
          scrollbar-width: none;
        }

        .view::-webkit-scrollbar {
          display: none;
        }
      }

      @media (max-width: 360px) {
        .view {
          padding-left: 16px;
          padding-right: 16px;
        }

        .story-name {
          font-size: 28px;
        }

        .controls {
          gap: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="phone" id="phoneFrame">
        <div class="backdrop"></div>

        <section class="view" id="homeView">
          <header>
            <div class="top-row">
              <div>
                <p class="eyebrow">BEDTIME STORIES</p>
                <h1 class="home-title">六六的睡前故事</h1>
              </div>
              <button class="icon-button" aria-label="夜间模式" type="button" data-static-icon="moon"></button>
            </div>
            <p class="hint">点大图就能听。想换故事，点下面的大图标。</p>
          </header>

          <section class="section">
            <div class="section-head">
              <h2 class="section-title">现在可以听</h2>
              <span class="section-note" id="recordingCount">2 个</span>
            </div>
            <div class="recorded-grid" id="recordedShelf"></div>
          </section>

          <section class="section">
            <div class="section-head">
              <h2 class="section-title">找故事</h2>
              <span class="section-note">点图标</span>
            </div>
            <div class="category-grid" id="categoryShelf"></div>
          </section>

          <section class="section">
            <div class="section-head">
              <h2 class="section-title" id="shelfTitle">全部故事</h2>
              <span class="section-note" id="shelfHint">已录音优先</span>
            </div>
            <div class="story-list" id="storyShelf"></div>
          </section>
        </section>

        <section class="view hidden" id="playerView">
          <header class="player-head">
            <button class="icon-button" id="backHome" aria-label="返回首页" type="button"></button>
            <p class="player-title-top">STORY PLAYER</p>
            <button class="icon-button" id="topFavoriteButton" aria-label="喜欢" type="button"></button>
          </header>

          <article class="story-panel">
            <img class="player-cover" id="playerImage" alt="" />
            <div class="story-copy">
              <p class="meta" id="playerMeta"></p>
              <h1 class="story-name" id="playerTitle"></h1>
              <p class="summary" id="playerSummary"></p>
            </div>
          </article>

          <section class="audio-panel">
            <div class="status-row">
              <div>
                <p class="status-label">播放状态</p>
                <p class="status-text" id="playStatus">等待录音</p>
              </div>
              <div class="audio-badge" id="audioBadge"></div>
            </div>

            <div class="time-row">
              <span id="currentTime">0:00</span>
              <span id="durationTime">--:--</span>
            </div>
            <div class="seek-wrap">
              <div class="seek-track"><div class="seek-fill" id="progressBar"></div></div>
              <input class="seek" id="seekBar" type="range" min="0" max="1000" value="0" disabled aria-label="拖动播放进度" />
            </div>

            <div class="controls">
              <button class="round-control" id="restartButton" aria-label="回到开头" type="button"></button>
              <button class="play-control" id="playButton" aria-label="播放" type="button">
                <span id="playIcon"></span>
                <span class="sr-only" id="playLabel">播放</span>
              </button>
              <button class="round-control" id="forwardButton" aria-label="快进十五秒" type="button"></button>
            </div>
          </section>
        </section>
      </section>
    </main>

    <script>
      const STORIES = [
        {
          id: "koala-plane",
          title: "考拉坐飞机的一天",
          tag: "旅行",
          category: "交通旅行",
          hasRecording: true,
          minutes: 8,
          image: "public/assets/story-covers/koala-plane.jpg",
          icon: "plane",
          summary: "考拉卡伊和妹妹沙伦坐大飞机去考拉隆坡看奶奶，机场、安检、登机和飞机餐都变成了一场热闹旅行。",
          audioSources: ["public/assets/real-audio/koala-plane-dad.mp3?v=20260729-fast2"]
        },
        {
          id: "crab-kaka",
          title: "小螃蟹咔咔的勇敢探险",
          tag: "勇敢",
          category: "动物朋友",
          hasRecording: false,
          minutes: 5,
          image: "public/assets/story-covers/crab-kaka.jpg",
          icon: "shell",
          summary: "小螃蟹咔咔想把彩虹贝壳送给妈妈，遇到沙坑、海藻和黑夜，最后学会勇敢往前走一小步。",
          audioSources: []
        },
        {
          id: "moose-firefighter",
          title: "驼鹿消防员的一天",
          tag: "消防员",
          category: "交通旅行",
          hasRecording: false,
          minutes: 5,
          image: "public/assets/story-covers/moose-firefighter.jpg",
          icon: "flame",
          summary: "驼鹿在消防站训练、出警、救援，最后用自己的大鹿角救下二十一只小豚鼠，成为真正的消防员。",
          audioSources: []
        },
        {
          id: "magic-pocket-courage",
          title: "神奇口袋里的勇气",
          tag: "勇气",
          category: "勇敢冒险",
          hasRecording: false,
          minutes: 5,
          image: "public/assets/story-covers/magic-pocket-courage.jpg",
          icon: "sparkles",
          summary: "小兔波波用星星口袋收集勇气，从害怕黑影到陪朋友走进草丛，一步一步变成小勇士。",
          audioSources: []
        },
        {
          id: "forest-magic-night",
          title: "森林里的奇妙夜",
          tag: "睡前",
          category: "睡前安抚",
          hasRecording: true,
          minutes: 4,
          image: "public/assets/story-covers/forest-magic-night.jpg",
          icon: "moon-star",
          summary: "小熊猫乐乐走进夜晚森林，看见萤火虫、发光蘑菇和夜光鹿，发现黑夜也可以很美好。",
          audioSources: ["public/assets/real-audio/forest-magic-night-recording.mp3?v=20260729-fast2"]
        },
        {
          id: "hedgehog-soft-hug",
          title: "小刺猬的软软拥抱",
          tag: "情绪",
          category: "动物朋友",
          hasRecording: false,
          minutes: 4,
          image: "public/assets/story-covers/hedgehog-soft-hug.jpg",
          icon: "heart",
          summary: "小刺猬团团因为背上的刺不能拥抱朋友而难过，后来发现自己的特别之处也能保护朋友。",
          audioSources: []
        },
        {
          id: "snail-slow-delivery",
          title: "小蜗牛的慢吞吞快递",
          tag: "成长",
          category: "生活习惯",
          hasRecording: false,
          minutes: 4,
          image: "public/assets/story-covers/snail-slow-delivery.jpg",
          icon: "package",
          summary: "小蜗牛慢慢送快递虽然很慢，却把一路上的花香、鸟鸣和阳光都带给了大家。",
          audioSources: []
        }
      ];

      const CATEGORIES = [
        { id: "all", label: "全部", icon: "library" },
        { id: "动物朋友", label: "动物", icon: "rabbit" },
        { id: "勇敢冒险", label: "冒险", icon: "sparkles" },
        { id: "睡前安抚", label: "晚安", icon: "moon-star" },
        { id: "交通旅行", label: "出行", icon: "plane" },
        { id: "生活习惯", label: "习惯", icon: "leaf" }
      ];

      const FALLBACK_IMAGE = "public/assets/story-covers/forest-magic-night.jpg";
      let currentStory = STORIES[0];
      let selectedCategory = "all";
      let activeAudio = null;
      let isPlaying = false;
      let pendingSeekRatio = null;

      const homeView = document.getElementById("homeView");
      const playerView = document.getElementById("playerView");
      const recordedShelf = document.getElementById("recordedShelf");
      const categoryShelf = document.getElementById("categoryShelf");
      const storyShelf = document.getElementById("storyShelf");
      const shelfTitle = document.getElementById("shelfTitle");
      const shelfHint = document.getElementById("shelfHint");
      const recordingCount = document.getElementById("recordingCount");
      const playerImage = document.getElementById("playerImage");
      const playerMeta = document.getElementById("playerMeta");
      const playerTitle = document.getElementById("playerTitle");
      const playerSummary = document.getElementById("playerSummary");
      const playStatus = document.getElementById("playStatus");
      const playButton = document.getElementById("playButton");
      const playIcon = document.getElementById("playIcon");
      const playLabel = document.getElementById("playLabel");
      const audioBadge = document.getElementById("audioBadge");
      const progressBar = document.getElementById("progressBar");
      const seekBar = document.getElementById("seekBar");
      const currentTime = document.getElementById("currentTime");
      const durationTime = document.getElementById("durationTime");
      const favoriteStories = new Set();

      function icon(name, className = "icon") {
        const paths = {
          moon: '<path d="M20 15.5A8.5 8.5 0 0 1 8.5 4a7 7 0 1 0 11.5 11.5z"/>',
          back: '<path d="M15 19 8 12l7-7"/>',
          heart: '<path d="M20.8 5.6a5.1 5.1 0 0 0-7.2 0L12 7.2l-1.6-1.6a5.1 5.1 0 1 0-7.2 7.2L12 21l8.8-8.2a5.1 5.1 0 0 0 0-7.2z"/>',
          headphones: '<path d="M4 14a8 8 0 0 1 16 0"/><path d="M4 14v4a2 2 0 0 0 2 2h2v-8H6a2 2 0 0 0-2 2z"/><path d="M20 14v4a2 2 0 0 1-2 2h-2v-8h2a2 2 0 0 1 2 2z"/>',
          library: '<path d="M4 19V5"/><path d="M9 19V5"/><path d="M14 19V5"/><path d="M19 19V5"/>',
          rabbit: '<path d="M8 14c-2 0-3.5 1.3-3.5 3s1.5 3 3.5 3h8c2 0 3.5-1.3 3.5-3S18 14 16 14"/><path d="M9 14c-1-4-1-8 1-10 2 2 3 5 2 9"/><path d="M15 14c1-4 1-8-1-10-2 2-3 5-2 9"/><path d="M9 17h.01"/><path d="M15 17h.01"/>',
          sparkles: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M5 18l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',
          "moon-star": '<path d="M17 17a7 7 0 0 1-9.5-9.5 8 8 0 1 0 9.5 9.5z"/><path d="M18 3l.6 1.6L20 5l-1.4.4L18 7l-.6-1.6L16 5l1.4-.4z"/>',
          plane: '<path d="M21 16 3 21l5-9-5-9 18 5-9 4z"/>',
          leaf: '<path d="M5 21c8-1 14-7 16-18C12 4 5 9 5 21z"/><path d="M5 21c4-5 8-8 13-10"/>',
          shell: '<path d="M4 17c0-6 4-10 8-10s8 4 8 10"/><path d="M4 17h16"/><path d="M8 17c0-5 2-9 4-10"/><path d="M16 17c0-5-2-9-4-10"/>',
          flame: '<path d="M12 22c4 0 7-3 7-7 0-3-2-5-4-7 .2 2-.8 3.2-2 4-1-3-3-5-5-6 .4 4-3 6-3 9 0 4 3 7 7 7z"/>',
          package: '<path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z"/><path d="M12 12 4 7.5"/><path d="M12 12l8-4.5"/><path d="M12 12v9"/>',
          playCircle: '<circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z" class="fill"/>',
          play: '<path d="m8 5 11 7-11 7z" class="fill"/>',
          pause: '<path d="M8 5h3v14H8z" class="fill"/><path d="M14 5h3v14h-3z" class="fill"/>',
          rotate: '<path d="M4 7v6h6"/><path d="M5.5 13A7 7 0 1 0 8 5.3L4 9"/>',
          skipBack: '<path d="M19 20 8 12l11-8z" class="fill"/><path d="M5 19V5"/>',
          skipForward: '<path d="m5 4 11 8-11 8z" class="fill"/><path d="M19 5v14"/>',
          micOff: '<path d="M9 9v3a3 3 0 0 0 5.1 2.1"/><path d="M15 9V6a3 3 0 0 0-5.1-2.1"/><path d="M5 11a7 7 0 0 0 11 5.7"/><path d="M19 11a7 7 0 0 1-.8 3.2"/><path d="M12 18v3"/><path d="M8 21h8"/><path d="M3 3l18 18"/>'
        };
        return `<svg class="${className}" viewBox="0 0 24 24" aria-hidden="true">${paths[name] || paths.library}</svg>`;
      }

      function setStaticIcons() {
        document.querySelectorAll("[data-static-icon]").forEach((node) => {
          node.innerHTML = icon(node.dataset.staticIcon);
        });
        document.getElementById("backHome").innerHTML = icon("back");
        document.getElementById("restartButton").innerHTML = icon("skipBack");
        document.getElementById("forwardButton").innerHTML = icon("skipForward");
      }

      function updateFavoriteButton() {
        const button = document.getElementById("topFavoriteButton");
        const isFavorite = favoriteStories.has(currentStory.id);
        button.classList.toggle("is-favorite", isFavorite);
        button.setAttribute("aria-pressed", String(isFavorite));
        button.setAttribute("aria-label", isFavorite ? "取消喜欢" : "喜欢");
        button.innerHTML = icon("heart");
      }

      function formatTime(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) return "--:--";
        const total = Math.floor(seconds);
        return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
      }

      function setPlayIcon(name) {
        playIcon.innerHTML = icon(name);
      }

      function updateProgress(current, duration) {
        const ratio = duration ? Math.min(Math.max(current / duration, 0), 1) : 0;
        progressBar.style.width = `${ratio * 100}%`;
        seekBar.value = String(Math.round(ratio * 1000));
        currentTime.textContent = formatTime(current);
        if (duration) durationTime.textContent = formatTime(duration);
      }

      function wireAudioEvents(audio) {
        audio.onloadedmetadata = () => {
          durationTime.textContent = formatTime(audio.duration);
          if (pendingSeekRatio !== null && Number.isFinite(audio.duration)) {
            audio.currentTime = pendingSeekRatio * audio.duration;
            pendingSeekRatio = null;
          }
          updateProgress(audio.currentTime, audio.duration);
        };
        audio.ontimeupdate = () => updateProgress(audio.currentTime, audio.duration);
        audio.onended = () => {
          isPlaying = false;
          playStatus.textContent = "故事讲完了";
          playLabel.textContent = "重播";
          setPlayIcon("rotate");
        };
        audio.onerror = () => {
          isPlaying = false;
          playStatus.textContent = "录音加载失败";
          setPlayIcon("play");
        };
      }

      function ensureAudio() {
        if (activeAudio) return activeAudio;
        if (!currentStory.audioSources.length) return null;
        activeAudio = new Audio(currentStory.audioSources[0]);
        activeAudio.preload = "metadata";
        wireAudioEvents(activeAudio);
        activeAudio.load();
        return activeAudio;
      }

      function setPlayerReadyState() {
        const hasAudio = currentStory.hasRecording && currentStory.audioSources.length > 0;
        playStatus.textContent = hasAudio ? "可以播放" : "等待录音";
        playLabel.textContent = hasAudio ? "播放" : "待录音";
        playButton.disabled = !hasAudio;
        seekBar.disabled = !hasAudio;
        document.getElementById("restartButton").disabled = !hasAudio;
        document.getElementById("forwardButton").disabled = !hasAudio;
        audioBadge.innerHTML = icon(hasAudio ? "headphones" : "micOff");
        currentTime.textContent = "0:00";
        durationTime.textContent = hasAudio ? `${currentStory.minutes}:00` : "--:--";
        progressBar.style.width = "0%";
        seekBar.value = "0";
        pendingSeekRatio = null;
        setPlayIcon(hasAudio ? "play" : "micOff");
      }

      function getVisibleStories() {
        const visible = STORIES.filter((story) => selectedCategory === "all" || story.category === selectedCategory);
        return visible.sort((a, b) => {
          if (a.hasRecording !== b.hasRecording) return a.hasRecording ? -1 : 1;
          return STORIES.indexOf(a) - STORIES.indexOf(b);
        });
      }

      function renderRecordedShelf() {
        recordedShelf.innerHTML = "";
        STORIES.filter((story) => story.hasRecording).forEach((story) => {
          const card = document.createElement("button");
          card.className = "recorded-card";
          card.type = "button";
          card.innerHTML = `
            <img src="${story.image}" alt="" onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}'" />
            <span class="mini-play">
              <strong>${story.title}</strong>
              ${icon("playCircle")}
            </span>
          `;
          card.addEventListener("click", () => openPlayer(story));
          recordedShelf.appendChild(card);
        });
      }

      function renderCategoryShelf() {
        categoryShelf.innerHTML = "";
        CATEGORIES.forEach((category) => {
          const active = selectedCategory === category.id;
          const card = document.createElement("button");
          card.className = `category-card${active ? " active" : ""}`;
          card.type = "button";
          card.innerHTML = `
            <span class="category-icon">${icon(category.icon)}</span>
            <span class="category-label">${category.label}</span>
          `;
          card.addEventListener("click", () => {
            selectedCategory = category.id;
            renderHome();
          });
          categoryShelf.appendChild(card);
        });
      }

      function renderStoryShelf() {
        storyShelf.innerHTML = "";
        const visibleStories = getVisibleStories();
        const category = CATEGORIES.find((item) => item.id === selectedCategory);
        const recorded = visibleStories.filter((story) => story.hasRecording).length;
        shelfTitle.textContent = category ? category.label : "全部故事";
        shelfHint.textContent = `${visibleStories.length} 个故事 · ${recorded} 个可听`;
        recordingCount.textContent = `${STORIES.filter((story) => story.hasRecording).length} 个`;

        visibleStories.forEach((story) => {
          const card = document.createElement("button");
          card.className = "story-card";
          card.type = "button";
          card.innerHTML = `
            <img src="${story.image}" alt="" onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}'" />
            <span>
              <small>${story.category} · ${story.minutes} 分钟${story.hasRecording ? " · 可听" : ""}</small>
              <strong>${story.title}</strong>
            </span>
            ${icon(story.hasRecording ? "headphones" : story.icon)}
          `;
          card.addEventListener("click", () => openPlayer(story));
          storyShelf.appendChild(card);
        });
      }

      function renderHome() {
        renderRecordedShelf();
        renderCategoryShelf();
        renderStoryShelf();
      }

      function openPlayer(story) {
        currentStory = story;
        stopAudio();
        playerImage.onerror = () => {
          playerImage.onerror = null;
          playerImage.src = FALLBACK_IMAGE;
        };
        playerImage.src = story.image;
        playerMeta.textContent = `${story.tag} · ${story.minutes} 分钟`;
        playerTitle.textContent = story.title;
        playerSummary.textContent = story.summary;
        setPlayerReadyState();
        if (story.hasRecording && story.audioSources.length) ensureAudio();
        updateFavoriteButton();
        homeView.classList.add("hidden");
        playerView.classList.remove("hidden");
        window.scrollTo({ top: 0, behavior: "instant" });
      }

      function stopAudio() {
        if (activeAudio) {
          activeAudio.pause();
          activeAudio.currentTime = 0;
          activeAudio = null;
        }
        isPlaying = false;
        const hasAudio = currentStory.hasRecording && currentStory.audioSources.length;
        setPlayIcon(hasAudio ? "play" : "micOff");
        playLabel.textContent = hasAudio ? "播放" : "待录音";
      }

      async function playCurrentStory() {
        if (!currentStory.hasRecording || !currentStory.audioSources.length) {
          playStatus.textContent = "等待录音";
          progressBar.style.width = "0%";
          return;
        }

        const audio = ensureAudio();
        if (!audio) return;

        if (isPlaying) {
          audio.pause();
          isPlaying = false;
          playStatus.textContent = "已暂停";
          playLabel.textContent = "继续";
          setPlayIcon("play");
          return;
        }

        try {
          isPlaying = true;
          playStatus.textContent = "正在播放";
          playLabel.textContent = "暂停";
          setPlayIcon("pause");
          await audio.play();
        } catch (error) {
          isPlaying = false;
          playStatus.textContent = "再点一次播放";
          setPlayIcon("play");
        }
      }

      document.getElementById("backHome").addEventListener("click", () => {
        stopAudio();
        playerView.classList.add("hidden");
        homeView.classList.remove("hidden");
        window.scrollTo({ top: 0, behavior: "instant" });
      });

      document.getElementById("restartButton").addEventListener("click", () => {
        const audio = ensureAudio();
        if (!audio) {
          playCurrentStory();
          return;
        }
        audio.currentTime = 0;
        updateProgress(audio.currentTime, audio.duration);
        if (!isPlaying) playCurrentStory();
      });

      document.getElementById("forwardButton").addEventListener("click", () => {
        const audio = ensureAudio();
        if (!audio || !Number.isFinite(audio.duration)) return;
        audio.currentTime = Math.min(audio.currentTime + 15, audio.duration);
        updateProgress(audio.currentTime, audio.duration);
      });

      document.getElementById("topFavoriteButton").addEventListener("click", () => {
        if (favoriteStories.has(currentStory.id)) {
          favoriteStories.delete(currentStory.id);
        } else {
          favoriteStories.add(currentStory.id);
        }
        updateFavoriteButton();
      });

      playButton.addEventListener("click", playCurrentStory);

      seekBar.addEventListener("input", () => {
        const ratio = Number(seekBar.value) / 1000;
        progressBar.style.width = `${ratio * 100}%`;
        const duration = activeAudio && Number.isFinite(activeAudio.duration) ? activeAudio.duration : currentStory.minutes * 60;
        currentTime.textContent = formatTime(ratio * duration);
      });

      seekBar.addEventListener("change", () => {
        const audio = ensureAudio();
        const ratio = Number(seekBar.value) / 1000;
        if (!audio) return;
        if (Number.isFinite(audio.duration)) {
          audio.currentTime = ratio * audio.duration;
          updateProgress(audio.currentTime, audio.duration);
        } else {
          pendingSeekRatio = ratio;
        }
      });

      setStaticIcons();
      renderHome();
    </script>
  </body>
</html>
